<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <title>Design decisions</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: var(
                    --font-sans,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif
                );
                color: var(--foreground, #202228);
                font-size: 14px;
                line-height: 1.5;
                --dg-muted: var(--muted-foreground, #626974);
                --dg-line: var(--border, #dfe1e6);
                --dg-surface: var(--card, #f8f9fb);
                --dg-accent: var(--primary, #654bbc);
                -webkit-font-smoothing: antialiased;
                font-variant-numeric: tabular-nums;
            }
            * {
                box-sizing: border-box;
            }
            [hidden] {
                display: none !important;
            }
            body {
                margin: 0;
            }
            button,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button,
            select {
                min-height: 40px;
                border: 1px solid transparent;
                border-radius: 6px;
                background: transparent;
                padding: 8px 12px;
                cursor: pointer;
            }
            button:hover {
                background: var(--secondary, #eceef2);
            }
            button:focus-visible,
            select:focus-visible,
            textarea:focus-visible,
            summary:focus-visible,
            #comparison:focus-visible {
                outline: 2px solid var(--ring, #876bcc);
                outline-offset: 2px;
            }
            button[aria-pressed='true'] {
                background: var(--accent, #eae4fa);
                color: var(--accent-foreground, #573e9d);
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            button:active:not(:disabled) {
                transform: scale(0.97);
            }
            kbd {
                display: inline-block;
                font: 11px var(--font-mono, ui-monospace, monospace);
                color: inherit;
                opacity: 0.8;
                border: 1px solid currentColor;
                border-radius: 4px;
                padding: 0 4px;
                margin-left: 4px;
                white-space: nowrap;
            }
            h1,
            h2,
            p,
            figure {
                margin: 0;
            }
            h1 {
                font-size: 22px;
                line-height: 1.3;
                letter-spacing: -0.4px;
                text-wrap: balance;
            }
            .muted {
                color: var(--dg-muted);
                font-size: 12px;
            }
            .toolbar {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 56px;
                border-bottom: 1px solid var(--dg-line);
                padding: 8px 16px;
            }
            .toolbar strong {
                font-weight: 600;
                letter-spacing: -0.2px;
            }
            #menu {
                min-width: 40px;
                padding: 8px;
                display: grid;
                place-items: center;
            }
            #menu svg {
                width: 18px;
                height: 18px;
            }
            #export {
                position: relative;
                margin-left: auto;
                border-color: var(--dg-line);
            }
            .export-dot {
                position: absolute;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--destructive, #c73939);
                top: -3px;
                right: -3px;
                box-shadow: 0 0 0 2px var(--background, Canvas);
            }
            #export[data-pending='false'] .export-dot {
                display: none;
            }
            .workspace {
                display: grid;
                grid-template-columns: 200px minmax(0, 1fr);
                position: relative;
                align-items: start;
            }
            aside {
                position: absolute;
                inset: 0 auto 0 0;
                width: 200px;
                border-right: 1px solid var(--dg-line);
                padding: 12px;
                overflow-y: auto;
                scrollbar-width: thin;
            }
            .side-tools {
                position: sticky;
                top: -12px;
                z-index: 2;
                padding: 0 0 8px;
                background: var(--background, Canvas);
            }
            #filter {
                border-color: var(--dg-line);
                width: 100%;
                background: var(--dg-surface);
                padding: 8px;
            }
            .nav-group {
                padding-bottom: 8px;
            }
            .nav-group h2 {
                font-size: 12px;
                font-weight: 600;
                color: var(--dg-muted);
                padding: 8px 8px 4px;
            }
            .nav-item {
                width: 100%;
                text-align: left;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 13px;
                padding: 8px;
                line-height: 1.4;
            }
            .nav-item[aria-current='true'] {
                background: var(--secondary, #eceef2);
                font-weight: 600;
            }
            .dot {
                width: 7px;
                height: 7px;
                border: 1px solid var(--dg-muted);
                border-radius: 50%;
                flex-shrink: 0;
            }
            .dot[data-choice='accept'] {
                background: var(--success, #286c50);
                border-color: var(--success, #286c50);
            }
            .dot[data-choice='decline'] {
                background: var(--dg-muted);
            }
            .dot[data-stale='true'] {
                background: var(--warning, #b58130);
                border-color: var(--warning, #b58130);
            }
            main {
                grid-column: 2;
                min-width: 0;
                padding: 16px;
            }
            .heading-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 4px;
            }
            #reason {
                margin-top: 8px;
                max-width: 78ch;
                color: var(--dg-muted);
            }
            #stale {
                margin-top: 12px;
                padding: 8px 12px;
                border-left: 3px solid var(--warning, #b58130);
                font-size: 13px;
                background: var(--warning-surface, #fff7e6);
            }
            .view-tools {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                margin: 12px 0;
            }
            .view-tools > div {
                display: flex;
                gap: 0;
                border: 1px solid var(--dg-line);
                border-radius: 7px;
                padding: 2px;
            }
            .view-tools button {
                padding: 4px 12px;
                min-height: 36px;
                font-size: 12px;
            }
            .comparison {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 12px;
                align-items: start;
            }
            .capture {
                min-width: 0;
                border: 1px solid var(--dg-line);
                border-radius: 8px;
                overflow: hidden;
                background: var(--dg-surface);
            }
            .capture figcaption {
                padding: 8px 12px;
                border-bottom: 1px solid var(--dg-line);
                display: flex;
                justify-content: space-between;
                gap: 8px;
                font-size: 12px;
                color: var(--dg-muted);
            }
            .capture figcaption strong {
                font-weight: 600;
                color: var(--foreground, #202228);
            }
            .capture svg {
                display: block;
                width: 100%;
                height: auto;
                max-height: 420px;
                background: var(--card, #fff);
            }
            .capture .text-evidence {
                padding: 20px;
                line-height: 1.7;
            }
            .unavailable {
                padding: 24px;
                color: var(--dg-muted);
                border: 1px dashed var(--dg-line);
                grid-column: 1/-1;
            }
            .comparison[data-device='mobile'] .capture {
                max-width: 390px;
                justify-self: center;
                width: 100%;
            }
            #context {
                font-size: 12px;
                margin-top: 4px;
                color: var(--dg-muted);
            }
            summary {
                cursor: pointer;
                min-height: 36px;
                display: list-item;
                width: fit-content;
                padding: 8px 0;
            }
            .context-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                padding: 8px 0;
            }
            .context-grid strong {
                font-weight: 600;
            }
            #evidence-note {
                margin: 4px 0 8px;
            }
            a {
                color: var(--dg-accent);
            }
            .decision-panel {
                margin-top: 4px;
                border-top: 1px solid var(--dg-line);
                padding-top: 12px;
            }
            .decision-row {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
            }
            .decision-actions,
            .steps {
                display: flex;
                gap: 8px;
            }
            .decision-actions button,
            .steps button {
                border-color: var(--dg-line);
            }
            .decision-actions
                button[data-choice='accept'][aria-pressed='true'] {
                background: var(--success, #286c50);
                color: var(--success-foreground, #fff);
            }
            .decision-actions
                button[data-choice='decline'][aria-pressed='true'] {
                background: var(--foreground, #202228);
                color: var(--background, #fff);
            }
            textarea {
                display: block;
                resize: vertical;
                width: 100%;
                max-width: 480px;
                min-height: 64px;
                max-height: 180px;
                border: 1px solid var(--dg-line);
                border-radius: 6px;
                background: transparent;
                padding: 8px 12px;
                margin-top: 12px;
            }
            textarea::placeholder {
                color: var(--dg-muted);
                opacity: 1;
            }
            #empty {
                padding: 32px 16px;
                text-align: center;
            }
            #empty-copy {
                color: var(--dg-muted);
                margin: 8px 0 16px;
            }
            #empty button {
                border-color: var(--dg-line);
            }
            .sr-only {
                position: absolute;
                top: 0;
                left: 0;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    color: var(--foreground, #e4e5e9);
                    --dg-muted: var(--muted-foreground, #a1a4ad);
                    --dg-line: var(--border, #33363e);
                    --dg-surface: var(--card, #1c1e24);
                }
                button:hover,
                .nav-item[aria-current='true'] {
                    background: var(--secondary, #2a2d35);
                }
                button[aria-pressed='true'] {
                    background: var(--accent, #3c3158);
                    color: var(--accent-foreground, #e3d6ff);
                }
                .capture figcaption strong {
                    color: var(--foreground, #e4e5e9);
                }
                #stale {
                    background: var(--warning-surface, #332b1c);
                }
            }
            @media (min-width: 1001px) {
                #menu {
                    display: none;
                }
            }
            @media (max-width: 1000px) {
                .workspace {
                    display: block;
                }
                aside {
                    position: relative;
                    inset: auto;
                    width: auto;
                    display: none;
                    border: 1px solid var(--dg-line);
                    border-radius: 8px;
                    padding: 8px;
                    max-height: 360px;
                    margin: 12px 16px 0;
                }
                body.sidebar-open aside {
                    display: block;
                }
                .side-tools {
                    top: -8px;
                }
                h1 {
                    font-size: 20px;
                }
            }
            @media (max-width: 480px) {
                .toolbar {
                    gap: 8px;
                }
                .toolbar strong {
                    font-size: 13px;
                }
                .toolbar #progress {
                    font-size: 11px;
                }
                .toolbar #export {
                    padding: 8px;
                }
                .view-tools button {
                    min-height: 40px;
                    padding: 8px;
                }
                .comparison {
                    grid-template-columns: minmax(0, 1fr);
                    gap: 8px;
                }
                .capture figcaption {
                    padding: 8px;
                }
                .decision-row {
                    gap: 8px;
                }
                .decision-actions,
                .steps {
                    gap: 4px;
                }
                .decision-row button {
                    padding: 8px;
                    font-size: 12px;
                    min-height: 44px;
                }
                .context-grid {
                    gap: 12px;
                }
                h1 {
                    font-size: 19px;
                }
            }

            .viewport-page {
                overflow: hidden;
            }
            .viewport-page .review-app {
                height: var(--dg-viewport);
                display: flex;
                flex-direction: column;
            }
            .viewport-page .toolbar {
                flex-shrink: 0;
            }
            .viewport-page .workspace {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                grid-template-rows: minmax(0, 1fr);
            }
            .viewport-page main {
                height: 100%;
                overflow-y: auto;
            }
            @media (max-width: 1000px) {
                .viewport-page .workspace {
                    display: flex;
                    flex-direction: column;
                }
                .viewport-page aside {
                    flex-shrink: 0;
                    max-height: 240px;
                }
                .viewport-page main {
                    flex: 1;
                    min-height: 0;
                    height: auto;
                }
            }
        </style>
    </head>
    <body>
        <div class="review-app">
            <header class="toolbar">
                <button
                    id="menu"
                    aria-label="Toggle change list"
                    aria-expanded="false"
                    aria-controls="sidebar"
                    title="Change list"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        aria-hidden="true"
                    >
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <path d="M9 4v16" />
                    </svg>
                </button>
                <strong id="board-title"></strong
                ><span id="progress" class="muted"></span>
                <button id="export">
                    Export<span class="export-dot" aria-hidden="true"></span>
                </button>
            </header>
            <div class="workspace">
                <aside id="sidebar" aria-label="Changes">
                    <div class="side-tools">
                        <label class="sr-only" for="filter"
                            >Filter changes</label
                        ><select id="filter">
                            <option value="pending">Needs decision</option>
                            <option value="all">All changes</option>
                            <option value="accept">Accepted</option>
                            <option value="decline">Declined</option>
                            <option value="notes">With notes</option>
                        </select>
                    </div>
                    <nav id="change-list" aria-label="Changes by section"></nav>
                </aside>
                <main id="main">
                    <div class="change-heading">
                        <div class="heading-top">
                            <span id="section" class="muted"></span
                            ><span id="position" class="muted"></span>
                        </div>
                        <h1 id="change-title"></h1>
                        <p id="reason"></p>
                        <p id="stale" role="status" hidden>
                            Comparison updated. Review this decision again; your
                            previous choice and note are preserved.
                        </p>
                    </div>
                    <div id="review-content">
                        <div class="view-tools">
                            <div role="group" aria-label="Screenshot size">
                                <button id="desktop" aria-pressed="true">
                                    Desktop</button
                                ><button id="mobile" aria-pressed="false">
                                    Phone <kbd>M</kbd>
                                </button>
                            </div>
                            <div
                                id="stage-controls"
                                role="group"
                                aria-label="Captured state"
                                hidden
                            ></div>
                            <button id="arrows" aria-pressed="true" hidden>
                                Arrows <kbd>A</kbd></button
                            ><button id="context-toggle" aria-pressed="false">
                                Full context <kbd>C</kbd>
                            </button>
                        </div>
                        <div
                            id="comparison"
                            class="comparison"
                            tabindex="0"
                            aria-label="Before and after"
                        ></div>
                        <details id="context">
                            <summary>Context</summary>
                            <div class="context-grid">
                                <div>
                                    <strong>Before</strong>
                                    <p id="before-text"></p>
                                </div>
                                <div>
                                    <strong>After</strong>
                                    <p id="after-text"></p>
                                </div>
                            </div>
                            <p id="evidence-note"></p>
                            <a id="source" target="_blank" rel="noreferrer"
                                >Source</a
                            >
                        </details>
                        <footer class="decision-panel">
                            <div class="decision-row">
                                <div
                                    class="decision-actions"
                                    role="group"
                                    aria-label="Decision"
                                >
                                    <button
                                        data-choice="accept"
                                        aria-pressed="false"
                                    >
                                        Accept <kbd>1</kbd></button
                                    ><button
                                        data-choice="decline"
                                        aria-pressed="false"
                                    >
                                        Decline <kbd>2</kbd>
                                    </button>
                                </div>
                                <div class="steps">
                                    <button id="prev">
                                        Previous <kbd>J</kbd></button
                                    ><button id="next">
                                        Next <kbd>K</kbd>
                                    </button>
                                </div>
                            </div>
                            <label class="sr-only" for="note"
                                >Note for this change</label
                            ><textarea
                                id="note"
                                rows="2"
                                placeholder="Add a note… (N)"
                            ></textarea>
                        </footer>
                    </div>
                    <div id="empty" hidden>
                        <h1 id="empty-title">No decisions left</h1>
                        <p id="empty-copy"></p>
                        <button id="show-all">View all changes</button>
                    </div>
                </main>
            </div>
        </div>
        <p id="announcement" class="sr-only" aria-live="polite"></p>

                    arrowleft: () => move(-1),
                    n: () => {
                        if (selected) $('note').focus();
                    },
                    m: () => {
                        device = device === 'desktop' ? 'mobile' : 'desktop';
                        render();
                        persist();
                    },
                    c: () => {
                        fullContext = !fullContext;
                        render();
                    },
                    a: () => {
                        arrowsOn = !arrowsOn;
                        render();
                        persist();
                    },
                    s: () => {
                        if (selected?.stages?.length) {
                            stageIndex =
                                (stageIndex + 1) % selected.stages.length;
                            render();
                        }
                    },
                    u: () => setFilter('pending'),
                }[key];
                if (action) {
                    event.preventDefault();
                    action();
                } else if (
                    event.code === 'Space' &&
                    !event.target.closest('button,a,summary')
                ) {
                    event.preventDefault();
                    holdingBefore = true;
                    renderComparison();
                }
            });
            document.addEventListener('keyup', (event) => {
                if (event.code === 'Space' && holdingBefore) {
                    holdingBefore = false;
                    renderComparison();
                }
            });
            window.addEventListener('blur', () => {
                if (holdingBefore) {
                    holdingBefore = false;
                    renderComparison();
                }
            });
            window.addEventListener('hashchange', () => {
                if (byId.has(location.hash.slice(1)))
                    choose(location.hash.slice(1));
            });
            $('export').onclick = () => {
                const url = URL.createObjectURL(
                    new Blob([JSON.stringify(record(), null, 2) + '\n'], {
                        type: 'application/json',
                    })
                );
                const link = document.createElement('a');
                link.href = url;
                link.download = BOARD.id + '-decisions.json';
                link.click();
                exportBaseline = decisionSnapshot();
                persist();
                $('announcement').textContent =
                    'Decision record download started';
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            if (filter !== 'all' && !matches(selected))
                selected = visible()[0] || null;
            render();
            persist();
        </script>
    </body>
</html>
