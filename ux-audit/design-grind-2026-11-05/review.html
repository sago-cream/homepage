<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <title>Design decisions</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: var(
                    --font-sans,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif
                );
                color: var(--foreground, #202228);
                font-size: 14px;
                line-height: 1.5;
                --dg-muted: var(--muted-foreground, #626974);
                --dg-line: var(--border, #dfe1e6);
                --dg-surface: var(--card, #f8f9fb);
                --dg-accent: var(--primary, #654bbc);
                -webkit-font-smoothing: antialiased;
                font-variant-numeric: tabular-nums;
            }
            * {
                box-sizing: border-box;
            }
            [hidden] {
                display: none !important;
            }
            body {
                margin: 0;
            }
            button,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button,
            select {
                min-height: 40px;
                border: 1px solid transparent;
                border-radius: 6px;
                background: transparent;
                padding: 8px 12px;
                cursor: pointer;
            }
            button:hover {
                background: var(--secondary, #eceef2);
            }
            button:focus-visible,
            select:focus-visible,
            textarea:focus-visible,
            summary:focus-visible,
            #comparison:focus-visible {
                outline: 2px solid var(--ring, #876bcc);
                outline-offset: 2px;
            }
            button[aria-pressed='true'] {
                background: var(--accent, #eae4fa);
                color: var(--accent-foreground, #573e9d);
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            button:active:not(:disabled) {
                transform: scale(0.97);
            }
            kbd {
                display: inline-block;
                font: 11px var(--font-mono, ui-monospace, monospace);
                color: inherit;
                opacity: 0.8;
                border: 1px solid currentColor;
                border-radius: 4px;
                padding: 0 4px;
                margin-left: 4px;
                white-space: nowrap;
            }
            h1,
            h2,
            p,
            figure {
                margin: 0;
            }
            h1 {
                font-size: 22px;
                line-height: 1.3;
                letter-spacing: -0.4px;
                text-wrap: balance;
            }
            .muted {
                color: var(--dg-muted);
                font-size: 12px;
            }
            .toolbar {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 56px;
                border-bottom: 1px solid var(--dg-line);
                padding: 8px 16px;
            }
            .toolbar strong {
                font-weight: 600;
                letter-spacing: -0.2px;
            }
            #menu {
                min-width: 40px;
                padding: 8px;
                display: grid;
                place-items: center;
            }
            #menu svg {
                width: 18px;
                height: 18px;
            }
            #export {
                position: relative;
                margin-left: auto;
                border-color: var(--dg-line);
            }
            .export-dot {
                position: absolute;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--destructive, #c73939);
                top: -3px;
                right: -3px;
                box-shadow: 0 0 0 2px var(--background, Canvas);
            }
            #export[data-pending='false'] .export-dot {
                display: none;
            }
            .workspace {
                display: grid;
                grid-template-columns: 200px minmax(0, 1fr);
                position: relative;
                align-items: start;
            }
            aside {
                position: absolute;
                inset: 0 auto 0 0;
                width: 200px;
                border-right: 1px solid var(--dg-line);
                padding: 12px;
                overflow-y: auto;
                scrollbar-width: thin;
            }
            .side-tools {
                position: sticky;
                top: -12px;
                z-index: 2;
                padding: 0 0 8px;
                background: var(--background, Canvas);
            }
            #filter {
                border-color: var(--dg-line);
                width: 100%;
                background: var(--dg-surface);
                padding: 8px;
            }
            .nav-group {
                padding-bottom: 8px;
            }
            .nav-group h2 {
                font-size: 12px;
                font-weight: 600;
                color: var(--dg-muted);
                padding: 8px 8px 4px;
            }
            .nav-item {
                width: 100%;
                text-align: left;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 13px;
                padding: 8px;
                line-height: 1.4;
            }
            .nav-item[aria-current='true'] {
                background: var(--secondary, #eceef2);
                font-weight: 600;
            }
            .dot {
                width: 7px;
                height: 7px;
                border: 1px solid var(--dg-muted);
                border-radius: 50%;
                flex-shrink: 0;
            }
            .dot[data-choice='accept'] {
                background: var(--success, #286c50);
                border-color: var(--success, #286c50);
            }
            .dot[data-choice='decline'] {
                background: var(--dg-muted);
            }
            .dot[data-stale='true'] {
                background: var(--warning, #b58130);
                border-color: var(--warning, #b58130);
            }
            main {
                grid-column: 2;
                min-width: 0;
                padding: 16px;
            }
            .heading-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 4px;
            }
            #reason {
                margin-top: 8px;
                max-width: 78ch;
                color: var(--dg-muted);
            }
            #stale {
                margin-top: 12px;
                padding: 8px 12px;
                border-left: 3px solid var(--warning, #b58130);
                font-size: 13px;
                background: var(--warning-surface, #fff7e6);
            }
            .view-tools {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                margin: 12px 0;
            }
            .view-tools > div {
                display: flex;
                gap: 0;
                border: 1px solid var(--dg-line);
                border-radius: 7px;
                padding: 2px;
            }
            .view-tools button {
                padding: 4px 12px;
                min-height: 36px;
                font-size: 12px;
            }
            .comparison {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 12px;
                align-items: start;
            }
            .capture {
                min-width: 0;
                border: 1px solid var(--dg-line);
                border-radius: 8px;
                overflow: hidden;
                background: var(--dg-surface);
            }
            .capture figcaption {
                padding: 8px 12px;
                border-bottom: 1px solid var(--dg-line);
                display: flex;
                justify-content: space-between;
                gap: 8px;
                font-size: 12px;
                color: var(--dg-muted);
            }
            .capture figcaption strong {
                font-weight: 600;
                color: var(--foreground, #202228);
            }
            .capture svg {
                display: block;
                width: 100%;
                height: auto;
                max-height: 420px;
                background: var(--card, #fff);
            }
            .capture .text-evidence {
                padding: 20px;
                line-height: 1.7;
            }
            .unavailable {
                padding: 24px;
                color: var(--dg-muted);
                border: 1px dashed var(--dg-line);
                grid-column: 1/-1;
            }
            .comparison[data-device='mobile'] .capture {
                max-width: 390px;
                justify-self: center;
                width: 100%;
            }
            #context {
                font-size: 12px;
                margin-top: 4px;
                color: var(--dg-muted);
            }
            summary {
                cursor: pointer;
                min-height: 36px;
                display: list-item;
                width: fit-content;
                padding: 8px 0;
            }
            .context-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                padding: 8px 0;
            }
            .context-grid strong {
                font-weight: 600;
            }
            #evidence-note {
                margin: 4px 0 8px;
            }
            a {
                color: var(--dg-accent);
            }
            .decision-panel {
                margin-top: 4px;
                border-top: 1px solid var(--dg-line);
                padding-top: 12px;
            }
            .decision-row {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
            }
            .decision-actions,
            .steps {
                display: flex;
                gap: 8px;
            }
            .decision-actions button,
            .steps button {
                border-color: var(--dg-line);
            }
            .decision-actions
                button[data-choice='accept'][aria-pressed='true'] {
                background: var(--success, #286c50);
                color: var(--success-foreground, #fff);
            }
            .decision-actions
                button[data-choice='decline'][aria-pressed='true'] {
                background: var(--foreground, #202228);
                color: var(--background, #fff);
            }
            textarea {
                display: block;
                resize: vertical;
                width: 100%;
                max-width: 480px;
                min-height: 64px;
                max-height: 180px;
                border: 1px solid var(--dg-line);
                border-radius: 6px;
                background: transparent;
                padding: 8px 12px;
                margin-top: 12px;
            }
            textarea::placeholder {
                color: var(--dg-muted);
                opacity: 1;
            }
            #empty {
                padding: 32px 16px;
                text-align: center;
            }
            #empty-copy {
                color: var(--dg-muted);
                margin: 8px 0 16px;
            }
            #empty button {
                border-color: var(--dg-line);
            }
            .sr-only {
                position: absolute;
                top: 0;
                left: 0;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    color: var(--foreground, #e4e5e9);
                    --dg-muted: var(--muted-foreground, #a1a4ad);
                    --dg-line: var(--border, #33363e);
                    --dg-surface: var(--card, #1c1e24);
                }
                button:hover,
                .nav-item[aria-current='true'] {
                    background: var(--secondary, #2a2d35);
                }
                button[aria-pressed='true'] {
                    background: var(--accent, #3c3158);
                    color: var(--accent-foreground, #e3d6ff);
                }
                .capture figcaption strong {
                    color: var(--foreground, #e4e5e9);
                }
                #stale {
                    background: var(--warning-surface, #332b1c);
                }
            }
            @media (min-width: 1001px) {
                #menu {
                    display: none;
                }
            }
            @media (max-width: 1000px) {
                .workspace {
                    display: block;
                }
                aside {
                    position: relative;
                    inset: auto;
                    width: auto;
                    display: none;
                    border: 1px solid var(--dg-line);
                    border-radius: 8px;
                    padding: 8px;
                    max-height: 360px;
                    margin: 12px 16px 0;
                }
                body.sidebar-open aside {
                    display: block;
                }
                .side-tools {
                    top: -8px;
                }
                h1 {
                    font-size: 20px;
                }
            }
            @media (max-width: 480px) {
                .toolbar {
                    gap: 8px;
                }
                .toolbar strong {
                    font-size: 13px;
                }
                .toolbar #progress {
                    font-size: 11px;
                }
                .toolbar #export {
                    padding: 8px;
                }
                .view-tools button {
                    min-height: 40px;
                    padding: 8px;
                }
                .comparison {
                    grid-template-columns: minmax(0, 1fr);
                    gap: 8px;
                }
                .capture figcaption {
                    padding: 8px;
                }
                .decision-row {
                    gap: 8px;
                }
                .decision-actions,
                .steps {
                    gap: 4px;
                }
                .decision-row button {
                    padding: 8px;
                    font-size: 12px;
                    min-height: 44px;
                }
                .context-grid {
                    gap: 12px;
                }
                h1 {
                    font-size: 19px;
                }
            }

            .viewport-page {
                overflow: hidden;
            }
            .viewport-page .review-app {
                height: var(--dg-viewport);
                display: flex;
                flex-direction: column;
            }
            .viewport-page .toolbar {
                flex-shrink: 0;
            }
            .viewport-page .workspace {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                grid-template-rows: minmax(0, 1fr);
            }
            .viewport-page main {
                height: 100%;
                overflow-y: auto;
            }
            @media (max-width: 1000px) {
                .viewport-page .workspace {
                    display: flex;
                    flex-direction: column;
                }
                .viewport-page aside {
                    flex-shrink: 0;
                    max-height: 240px;
                }
                .viewport-page main {
                    flex: 1;
                    min-height: 0;
                    height: auto;
                }
            }
        </style>
    </head>
    <body>
        <div class="review-app">
            <header class="toolbar">
                <button
                    id="menu"
                    aria-label="Toggle change list"
                    aria-expanded="false"
                    aria-controls="sidebar"
                    title="Change list"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        aria-hidden="true"
                    >
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <path d="M9 4v16" />
                    </svg>
                </button>
                <strong id="board-title"></strong
                ><span id="progress" class="muted"></span>
                <button id="export">
                    Export<span class="export-dot" aria-hidden="true"></span>
                </button>
            </header>
            <div class="workspace">
                <aside id="sidebar" aria-label="Changes">
                    <div class="side-tools">
                        <label class="sr-only" for="filter"
                            >Filter changes</label
                        ><select id="filter">
                            <option value="pending">Needs decision</option>
                            <option value="all">All changes</option>
                            <option value="accept">Accepted</option>
                            <option value="decline">Declined</option>
                            <option value="notes">With notes</option>
                        </select>
                    </div>
                    <nav id="change-list" aria-label="Changes by section"></nav>
                </aside>
                <main id="main">
                    <div class="change-heading">
                        <div class="heading-top">
                            <span id="section" class="muted"></span
                            ><span id="position" class="muted"></span>
                        </div>
                        <h1 id="change-title"></h1>
                        <p id="reason"></p>
                        <p id="stale" role="status" hidden>
                            Comparison updated. Review this decision again; your
                            previous choice and note are preserved.
                        </p>
                    </div>
                    <div id="review-content">
                        <div class="view-tools">
                            <div role="group" aria-label="Screenshot size">
                                <button id="desktop" aria-pressed="true">
                                    Desktop</button
                                ><button id="mobile" aria-pressed="false">
                                    Phone <kbd>M</kbd>
                                </button>
                            </div>
                            <div
                                id="stage-controls"
                                role="group"
                                aria-label="Captured state"
                                hidden
                            ></div>
                            <button id="arrows" aria-pressed="true" hidden>
                                Arrows <kbd>A</kbd></button
                            ><button id="context-toggle" aria-pressed="false">
                                Full context <kbd>C</kbd>
                            </button>
                        </div>
                        <div
                            id="comparison"
                            class="comparison"
                            tabindex="0"
                            aria-label="Before and after"
                        ></div>
                        <details id="context">
                            <summary>Context</summary>
                            <div class="context-grid">
                                <div>
                                    <strong>Before</strong>
                                    <p id="before-text"></p>
                                </div>
                                <div>
                                    <strong>After</strong>
                                    <p id="after-text"></p>
                                </div>
                            </div>
                            <p id="evidence-note"></p>
                            <a id="source" target="_blank" rel="noreferrer"
                                >Source</a
                            >
                        </details>
                        <footer class="decision-panel">
                            <div class="decision-row">
                                <div
                                    class="decision-actions"
                                    role="group"
                                    aria-label="Decision"
                                >
                                    <button
                                        data-choice="accept"
                                        aria-pressed="false"
                                    >
                                        Accept <kbd>1</kbd></button
                                    ><button
                                        data-choice="decline"
                                        aria-pressed="false"
                                    >
                                        Decline <kbd>2</kbd>
                                    </button>
                                </div>
                                <div class="steps">
                                    <button id="prev">
                                        Previous <kbd>J</kbd></button
                                    ><button id="next">
                                        Next <kbd>K</kbd>
                                    </button>
                                </div>
                            </div>
                            <label class="sr-only" for="note"
                                >Note for this change</label
                            ><textarea
                                id="note"
                                rows="2"
                                placeholder="Add a note… (N)"
                            ></textarea>
                        </footer>
                    </div>
                    <div id="empty" hidden>
                        <h1 id="empty-title">No decisions left</h1>
                        <p id="empty-copy"></p>
                        <button id="show-all">View all changes</button>
                    </div>
                </main>
            </div>
        </div>
        <p id="announcement" class="sr-only" aria-live="polite"></p>

        <script>
            'use strict';
            const BOARD = JSON.parse(
                document.getElementById('board-data').textContent
            );
            const $ = (id) => document.getElementById(id);
            function fitViewport() {
                if (window.self === window.top) {
                    document.documentElement.style.setProperty(
                        '--dg-viewport',
                        window.innerHeight + 'px'
                    );
                    document.body.classList.add('viewport-page');
                }
            }
            fitViewport();
            window.addEventListener('resize', fitViewport);
            const CHOICES = ['accept', 'decline'];
            const FILTERS = ['pending', 'all', 'accept', 'decline', 'notes'];
            const key = 'design-grind:' + BOARD.id + ':v1';
            const items = BOARD.changes;
            const byId = new Map(items.map((item) => [item.id, item]));
            const safe = (value) =>
                String(value ?? '').replace(
                    /[&<>"']/g,
                    (char) =>
                        ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                            "'": '&#39;',
                        })[char]
                );
            let stored = {};
            try {
                stored = JSON.parse(localStorage.getItem(key)) || {};
            } catch {}
            function cleanDecisions(raw) {
                if (!raw || typeof raw !== 'object' || Array.isArray(raw))
                    throw new Error('Invalid decisions record');
                const result = Object.create(null);
                for (const [id, value] of Object.entries(raw)) {
                    if (!byId.has(id)) continue;
                    if (
                        !value ||
                        typeof value !== 'object' ||
                        Array.isArray(value) ||
                        !(
                            value.choice == null ||
                            CHOICES.includes(value.choice)
                        ) ||
                        (value.note !== undefined &&
                            typeof value.note !== 'string')
                    ) {
                        throw new Error('Invalid decision for ' + id);
                    }
                    result[id] = {
                        choice: value.choice ?? null,
                        note: (value.note || '').slice(0, 12000),
                        fingerprint:
                            typeof value.fingerprint === 'string'
                                ? value.fingerprint
                                : '',
                        updatedAt:
                            typeof value.updatedAt === 'string'
                                ? value.updatedAt
                                : '',
                    };
                }
                return result;
            }
            let decisions;
            try {
                decisions = cleanDecisions(stored.decisions || {});
            } catch {
                decisions = Object.create(null);
            }
            let filter = FILTERS.includes(stored.filter)
                ? stored.filter
                : BOARD.initialFilter || 'pending';
            let selected =
                byId.get(location.hash.slice(1)) ||
                byId.get(stored.selected) ||
                byId.get(BOARD.initialChange) ||
                items[0];
            let device = stored.device === 'mobile' ? 'mobile' : 'desktop';
            let fullContext = false,
                holdingBefore = false,
                stageIndex = 0,
                arrowsOn = stored.arrowsOn !== false;
            function decision(item) {
                return (
                    decisions[item.id] || {
                        choice: null,
                        note: '',
                        fingerprint: '',
                        updatedAt: '',
                    }
                );
            }
            function decisionSnapshot() {
                return JSON.stringify(
                    items.flatMap((item) => {
                        const d = decision(item);
                        return d.choice || d.note
                            ? [
                                  [
                                      item.id,
                                      d.choice,
                                      d.note,
                                      d.choice ? d.fingerprint : null,
                                  ],
                              ]
                            : [];
                    })
                );
            }
            let exportBaseline =
                typeof stored.exportBaseline === 'string'
                    ? stored.exportBaseline
                    : decisionSnapshot();
            function stale(item) {
                const d = decision(item);
                return Boolean(d.choice && d.fingerprint !== item.fingerprint);
            }
            function matches(item) {
                const d = decision(item);
                if (filter === 'all') return true;
                if (filter === 'notes') return Boolean(d.note.trim());
                if (filter === 'pending') return !d.choice || stale(item);
                return d.choice === filter && !stale(item);
            }
            function visible() {
                return items.filter(matches);
            }
            function navigationTarget(direction) {
                const list = visible(),
                    current = items.indexOf(selected);
                const next =
                    direction > 0
                        ? list.find((item) => items.indexOf(item) > current)
                        : [...list]
                              .reverse()
                              .find((item) => items.indexOf(item) < current);
                return (
                    next ||
                    (filter === 'pending'
                        ? direction > 0
                            ? list[0]
                            : list.at(-1)
                        : null)
                );
            }
            function record() {
                return {
                    schemaVersion: 1,
                    boardId: BOARD.id,
                    revision: BOARD.revision || null,
                    decisions: Object.fromEntries(
                        items
                            .filter((item) => decisions[item.id])
                            .map((item) => [item.id, decisions[item.id]])
                    ),
                };
            }
            function setExportPending(pending) {
                $('export').dataset.pending = String(pending);
                const label = pending
                    ? 'Export decisions; changes not exported'
                    : 'Export decisions';
                $('export').setAttribute('aria-label', label);
                $('export').title = pending
                    ? 'Changes not exported'
                    : 'Export decisions';
            }
            function persist() {
                setExportPending(decisionSnapshot() !== exportBaseline);
                try {
                    localStorage.setItem(
                        key,
                        JSON.stringify({
                            decisions,
                            exportBaseline,
                            filter,
                            selected: selected?.id,
                            device,
                            arrowsOn,
                        })
                    );
                } catch {}
            }
            function renderNav() {
                const groups = new Map();
                for (const item of visible()) {
                    if (!groups.has(item.group)) groups.set(item.group, []);
                    groups.get(item.group).push(item);
                }
                $('change-list').innerHTML = [...groups]
                    .map(
                        ([name, group]) =>
                            '<section class="nav-group"><h2>' +
                            safe(name) +
                            '</h2>' +
                            group
                                .map(
                                    (item) =>
                                        '<button class="nav-item" data-id="' +
                                        item.id +
                                        '" aria-current="' +
                                        (selected?.id === item.id) +
                                        '">' +
                                        '<span class="dot" aria-label="' +
                                        (stale(item)
                                            ? 'Comparison updated'
                                            : safe(
                                                  decision(item).choice ||
                                                      'Pending'
                                              )) +
                                        '" data-choice="' +
                                        safe(decision(item).choice) +
                                        '" data-stale="' +
                                        stale(item) +
                                        '"></span>' +
                                        '<span>' +
                                        safe(item.title) +
                                        '</span></button>'
                                )
                                .join('') +
                            '</section>'
                    )
                    .join('');
                const completed = items.filter(
                    (item) => decision(item).choice && !stale(item)
                ).length;
                $('progress').textContent =
                    completed + ' / ' + items.length + ' decided';
                $('filter').value = filter;
                const active = $('change-list').querySelector(
                    '[aria-current=true]'
                );
                if (active && $('sidebar').clientHeight) {
                    const row = active.getBoundingClientRect(),
                        pane = $('sidebar').getBoundingClientRect();
                    const top =
                        pane.top +
                        document.querySelector('.side-tools').offsetHeight;
                    if (row.top < top) $('sidebar').scrollTop += row.top - top;
                    else if (row.bottom > pane.bottom)
                        $('sidebar').scrollTop += row.bottom - pane.bottom;
                }
            }
            function renderComparison() {
                const container = $('comparison');
                container.dataset.device = device;
                if (!selected) return;
                const pair = selected.stages?.length
                    ? selected.stages[stageIndex]?.variants?.[device]
                    : selected.variants?.[device];
                const hasArrows =
                    pair &&
                    ['before', 'after'].some(
                        (side) => pair[side]?.arrows?.length
                    );
                $('arrows').hidden = !hasArrows;
                $('arrows').setAttribute('aria-pressed', String(arrowsOn));
                if (!pair && selected.kind !== 'evidence') {
                    container.innerHTML =
                        '<p class="unavailable">No ' +
                        (device === 'mobile' ? 'phone' : 'desktop') +
                        ' capture for this change.</p>';
                    return;
                }
                container.innerHTML = ['before', 'after']
                    .map((slot) => {
                        const shown = holdingBefore ? 'before' : slot;
                        const label = shown === 'before' ? 'Before' : 'After';
                        const image = pair?.[shown];
                        const crop =
                            image &&
                            (fullContext
                                ? [0, 0, image.width, image.height]
                                : image.crop);
                        const annotations =
                            image && arrowsOn
                                ? (image.arrows || [])
                                      .map((arrow, index) => {
                                          const id =
                                              'arrow-' +
                                              selected.id +
                                              '-' +
                                              slot +
                                              '-' +
                                              stageIndex +
                                              '-' +
                                              index;
                                          const width = Math.max(
                                              56,
                                              arrow.label.length * 6.8 + 16
                                          );
                                          const startX =
                                                  arrow.labelX + width / 2,
                                              startY = arrow.labelY + 22;
                                          return (
                                              '<g class="annotation" pointer-events="none"><defs><marker id="' +
                                              id +
                                              '" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#6d28d9"/></marker></defs>' +
                                              '<path d="M' +
                                              startX +
                                              ',' +
                                              startY +
                                              ' L' +
                                              arrow.x +
                                              ',' +
                                              arrow.y +
                                              '" fill="none" stroke="white" stroke-width="5" vector-effect="non-scaling-stroke"/>' +
                                              '<path d="M' +
                                              startX +
                                              ',' +
                                              startY +
                                              ' L' +
                                              arrow.x +
                                              ',' +
                                              arrow.y +
                                              '" fill="none" stroke="#6d28d9" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#' +
                                              id +
                                              ')"/>' +
                                              '<rect x="' +
                                              arrow.labelX +
                                              '" y="' +
                                              arrow.labelY +
                                              '" width="' +
                                              width +
                                              '" height="22" rx="4" fill="#6d28d9"/>' +
                                              '<text x="' +
                                              (arrow.labelX + 8) +
                                              '" y="' +
                                              (arrow.labelY + 15) +
                                              '" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="white">' +
                                              safe(arrow.label) +
                                              '</text></g>'
                                          );
                                      })
                                      .join('')
                                : '';
                        const body = image
                            ? '<svg role="img" aria-label="' +
                              label +
                              ': ' +
                              safe(selected.title) +
                              '" viewBox="' +
                              crop.join(' ') +
                              '"><image href="' +
                              BOARD.assets[image.asset] +
                              '" width="' +
                              image.width +
                              '" height="' +
                              image.height +
                              '"/>' +
                              annotations +
                              '</svg>'
                            : '<p class="text-evidence">' +
                              safe(
                                  shown === 'before'
                                      ? selected.beforeText
                                      : selected.afterText
                              ) +
                              '</p>';
                        return (
                            '<figure class="capture" data-side="' +
                            slot +
                            '"><figcaption><strong>' +
                            label +
                            '</strong><span>' +
                            (image
                                ? image.width + ' × ' + image.height
                                : 'Text evidence') +
                            '</span></figcaption>' +
                            body +
                            '</figure>'
                        );
                    })
                    .join('');
            }
            function render() {
                renderNav();
                const empty = !selected;
                document.querySelector('.change-heading').hidden = empty;
                $('review-content').hidden = empty;
                $('empty').hidden = !empty;
                $('change-title').textContent =
                    selected?.title ||
                    (filter === 'pending'
                        ? 'All decisions reviewed'
                        : 'No matching changes');
                $('section').textContent = selected?.group || '';
                $('reason').textContent = selected?.reason || '';
                $('stale').hidden = !selected || !stale(selected);
                const list = visible();
                const index = list.indexOf(selected);
                $('position').textContent = selected
                    ? index >= 0
                        ? index + 1 + ' / ' + list.length
                        : 'Decision saved'
                    : '';
                $('empty-title').textContent =
                    filter === 'pending'
                        ? 'No decisions left'
                        : 'Nothing in this filter';
                $('empty-copy').textContent =
                    filter === 'pending'
                        ? 'You can revisit any choice or export the record.'
                        : 'Your decisions and notes are preserved.';
                $('prev').disabled =
                    !navigationTarget(-1) || navigationTarget(-1) === selected;
                const next = navigationTarget(1),
                    finish = selected && filter === 'pending' && !list.length;
                $('next').disabled = !finish && (!next || next === selected);
                $('next').innerHTML =
                    (finish ? 'Finish' : 'Next') + ' <kbd>K</kbd>';
                if (!selected) return;
                const d = decision(selected);
                document.querySelectorAll('[data-choice]').forEach((button) => {
                    if (button.tagName === 'BUTTON')
                        button.setAttribute(
                            'aria-pressed',
                            String(
                                button.dataset.choice === d.choice &&
                                    !stale(selected)
                            )
                        );
                });
                $('note').value = d.note;
                $('before-text').textContent = selected.beforeText;
                $('after-text').textContent = selected.afterText;
                $('evidence-note').textContent =
                    selected.context ||
                    (selected.kind === 'evidence'
                        ? 'Supporting work; no visual comparison is claimed.'
                        : 'Screenshots show appearance. They do not prove interaction behavior.');
                $('source').hidden = !/^https:\/\//.test(
                    selected.sourceUrl || ''
                );
                if (!$('source').hidden) $('source').href = selected.sourceUrl;
                for (const name of ['desktop', 'mobile'])
                    $(name).setAttribute(
                        'aria-pressed',
                        String(device === name)
                    );
                $('context-toggle').setAttribute(
                    'aria-pressed',
                    String(fullContext)
                );
                $('context-toggle').innerHTML =
                    (fullContext ? 'Detail' : 'Full context') + ' <kbd>C</kbd>';
                $('context-toggle').disabled = selected.kind === 'evidence';
                $('stage-controls').hidden = !(selected.stages?.length > 1);
                $('stage-controls').innerHTML = (selected.stages || [])
                    .map(
                        (stage, index) =>
                            '<button data-stage="' +
                            index +
                            '" aria-pressed="' +
                            (index === stageIndex) +
                            '">' +
                            safe(stage.label) +
                            (index === (stageIndex + 1) % selected.stages.length
                                ? ' <kbd>S</kbd>'
                                : '') +
                            '</button>'
                    )
                    .join('');
                renderComparison();
                $('announcement').textContent =
                    selected.group + ': ' + selected.title;
            }
            function choose(id) {
                selected = byId.get(id) || null;
                stageIndex = 0;
                holdingBefore = false;
                $('context').open = false;
                if (selected) {
                    try {
                        history.replaceState(null, '', '#' + selected.id);
                    } catch {}
                }
                render();
                persist();
            }
            function move(direction) {
                const list = visible();
                if (!list.length) {
                    choose(null);
                    return;
                }
                const next = navigationTarget(direction);
                if (next) choose(next.id);
            }
            function decide(choice) {
                if (!selected) return;
                decisions[selected.id] = {
                    ...decision(selected),
                    choice,
                    fingerprint: selected.fingerprint,
                    updatedAt: new Date().toISOString(),
                };
                render();
                $('announcement').textContent =
                    choice === 'accept' ? 'Accepted' : 'Declined';
                persist();
            }
            function setFilter(value) {
                filter = value;
                const list = visible();
                choose((list.includes(selected) ? selected : list[0])?.id);
            }
            $('board-title').textContent = BOARD.title;
            document.title = BOARD.title;
            $('filter').onchange = () => setFilter($('filter').value);
            $('change-list').onclick = (event) => {
                const button = event.target.closest('[data-id]');
                if (button) {
                    choose(button.dataset.id);
                    document.body.classList.remove('sidebar-open');
                    $('menu').setAttribute('aria-expanded', 'false');
                }
            };
            document
                .querySelectorAll('button[data-choice]')
                .forEach((button) => {
                    button.onclick = () => decide(button.dataset.choice);
                });
            $('prev').onclick = () => move(-1);
            $('next').onclick = () => move(1);
            $('show-all').onclick = () => setFilter('all');
            $('note').oninput = () => {
                if (!selected) return;
                decisions[selected.id] = {
                    ...decision(selected),
                    note: $('note').value.slice(0, 12000),
                    updatedAt: new Date().toISOString(),
                };
                // A note never reconfirms an outdated accept/decline choice.
                renderNav();
                persist();
            };
            $('menu').onclick = () => {
                const open = document.body.classList.toggle('sidebar-open');
                $('menu').setAttribute('aria-expanded', String(open));
            };
            for (const name of ['desktop', 'mobile'])
                $(name).onclick = () => {
                    device = name;
                    render();
                    persist();
                };
            $('context-toggle').onclick = () => {
                fullContext = !fullContext;
                render();
            };
            $('arrows').onclick = () => {
                arrowsOn = !arrowsOn;
                render();
                persist();
            };
            $('stage-controls').onclick = (event) => {
                const button = event.target.closest('[data-stage]');
                if (button) {
                    stageIndex = Number(button.dataset.stage);
                    render();
                }
            };
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    if (event.target === $('note')) {
                        event.target.blur();
                        $('comparison').focus();
                    }
                    return;
                }
                if (
                    event.ctrlKey ||
                    event.metaKey ||
                    event.altKey ||
                    event.repeat ||
                    event.isComposing ||
                    event.target.closest(
                        'input,textarea,select,[contenteditable=true]'
                    )
                )
                    return;
                const key = event.key.toLowerCase();
                const action = {
                    1: () => decide('accept'),
                    2: () => decide('decline'),
                    j: () => move(-1),
                    k: () => move(1),
                    arrowright: () => move(1),
                    arrowleft: () => move(-1),
                    n: () => {
                        if (selected) $('note').focus();
                    },
                    m: () => {
                        device = device === 'desktop' ? 'mobile' : 'desktop';
                        render();
                        persist();
                    },
                    c: () => {
                        fullContext = !fullContext;
                        render();
                    },
                    a: () => {
                        arrowsOn = !arrowsOn;
                        render();
                        persist();
                    },
                    s: () => {
                        if (selected?.stages?.length) {
                            stageIndex =
                                (stageIndex + 1) % selected.stages.length;
                            render();
                        }
                    },
                    u: () => setFilter('pending'),
                }[key];
                if (action) {
                    event.preventDefault();
                    action();
                } else if (
                    event.code === 'Space' &&
                    !event.target.closest('button,a,summary')
                ) {
                    event.preventDefault();
                    holdingBefore = true;
                    renderComparison();
                }
            });
            document.addEventListener('keyup', (event) => {
                if (event.code === 'Space' && holdingBefore) {
                    holdingBefore = false;
                    renderComparison();
                }
            });
            window.addEventListener('blur', () => {
                if (holdingBefore) {
                    holdingBefore = false;
                    renderComparison();
                }
            });
            window.addEventListener('hashchange', () => {
                if (byId.has(location.hash.slice(1)))
                    choose(location.hash.slice(1));
            });
            $('export').onclick = () => {
                const url = URL.createObjectURL(
                    new Blob([JSON.stringify(record(), null, 2) + '\n'], {
                        type: 'application/json',
                    })
                );
                const link = document.createElement('a');
                link.href = url;
                link.download = BOARD.id + '-decisions.json';
                link.click();
                exportBaseline = decisionSnapshot();
                persist();
                $('announcement').textContent =
                    'Decision record download started';
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            if (filter !== 'all' && !matches(selected))
                selected = visible()[0] || null;
            render();
            persist();
        </script>
    </body>
</html>
